<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1144" height="420" viewBox="0 0 1144 420" role="img" aria-labelledby="board-title">
  <title id="board-title">A drawing of the Delivery board. The card APP-3 is held over Implement, and the drop box says what will start: Claude Code, sonnet, medium.</title>
  <!-- Drawn by hand from the board's own markup: the column labels, the lines under them and the drop
       box words are the client's, and the colours are the values of packages/ui/src/tokens.css. -->
  <style>
    :root {
      --bg: oklch(0.968 0.004 80);
      --card: oklch(0.998 0.002 80);
      --line: oklch(0.90 0.006 80);
      --line-2: oklch(0.85 0.007 80);
      --ink: oklch(0.21 0.008 75);
      --ink-2: oklch(0.35 0.008 75);
      --muted: oklch(0.48 0.008 75);
      --faint: oklch(0.62 0.006 80);
      --amber: oklch(0.51 0.14 62);
      --amber-bg: oklch(0.78 0.15 72 / 0.17);
      --amber-line: oklch(0.62 0.14 65 / 0.55);
      --hatch: oklch(0.70 0.14 70 / 0.07);
      --green: oklch(0.48 0.13 152);
      --green-bg: oklch(0.62 0.14 152 / 0.13);
      --shadow: oklch(0.20 0.01 75 / 0.16);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(0.145 0.006 75);
        --card: oklch(0.212 0.008 75);
        --line: oklch(0.262 0.007 75);
        --line-2: oklch(0.32 0.008 75);
        --ink: oklch(0.94 0.006 80);
        --ink-2: oklch(0.82 0.007 80);
        --muted: oklch(0.68 0.008 80);
        --faint: oklch(0.53 0.008 80);
        --amber: oklch(0.81 0.14 72);
        --amber-bg: oklch(0.81 0.14 72 / 0.11);
        --amber-line: oklch(0.81 0.14 72 / 0.42);
        --hatch: oklch(0.81 0.14 72 / 0.035);
        --green: oklch(0.80 0.15 152);
        --green-bg: oklch(0.80 0.15 152 / 0.12);
        --shadow: oklch(0 0 0 / 0.42);
      }
    }
    svg { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .page { fill: var(--bg); stroke: var(--line); }
    .rule { stroke: var(--line); }
    .hatch { fill: url(#hatch); }
    .stripe { fill: var(--hatch); }
    .ring { fill: none; stroke: var(--amber); stroke-width: 1.5; }
    .name { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .box { fill: none; stroke: var(--line-2); }
    .box.agent { fill: var(--amber-bg); stroke: var(--amber-line); }
    .glyph { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .glyph.agent { stroke: var(--amber); }
    text.col { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .count { font-size: 11px; fill: var(--muted); }
    .says { font-size: 11px; fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--line); }
    .card.ready { stroke: var(--green); }
    .card.running { stroke: var(--amber); }
    .card.ghost { stroke: var(--faint); stroke-dasharray: 4 3; }
    .lift { filter: url(#lift); }
    .key { font-size: 11.5px; fill: var(--muted); }
    .title { font-size: 13.5px; font-weight: 500; fill: var(--ink); }
    .ghost-title { font-size: 13.5px; font-weight: 500; fill: var(--muted); }
    .act { font-size: 11px; fill: var(--ink-2); }
    .pill { font-size: 12px; font-weight: 500; }
    .pill-ready { fill: var(--green-bg); }
    .pill-running { fill: var(--amber-bg); }
    .ready-ink { fill: var(--green); }
    .amber-ink { fill: var(--amber); }
    .drop { fill: var(--amber-bg); stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .drop-head { font-size: 13px; font-weight: 600; fill: var(--amber); }
    .bolt { fill: none; stroke: var(--amber); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .command { font-size: 11.5px; fill: var(--ink-2); }
    .esc { font-size: 11px; fill: var(--muted); }
    .slim { font-size: 12px; font-weight: 500; fill: var(--muted); }
    .slim.agent { fill: var(--ink-2); }
    .slim .count { fill: inherit; }
    .starts { font-size: 10.5px; font-weight: 400; }
    .drop-shadow { flood-color: var(--shadow); }
  </style>
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="stripe" width="6" height="12" />
    </pattern>
    <filter id="lift" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow class="drop-shadow" dx="0" dy="12" stdDeviation="12" />
    </filter>
    <symbol id="you" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></symbol>
    <symbol id="agent" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" /></symbol>
    <symbol id="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
    <symbol id="archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1" /><path d="M5 9v10h14V9M10 13h4" /></symbol>
  </defs>

  <rect class="page" x="0.5" y="0.5" width="1143" height="419" rx="12" />
  <text class="name" x="24" y="33">Delivery</text>
  <line class="rule" x1="0" y1="52.5" x2="1144" y2="52.5" />

  <g data-column="Inbox">
    <rect class="box" x="30.5" y="78.5" width="21" height="21" rx="6" />
    <use href="#you" xlink:href="#you" class="glyph" x="34.5" y="82.5" width="13" height="13" />
    <text class="col" x="59" y="94">Inbox</text>
    <text class="count mono" x="214" y="94" text-anchor="end">2</text>
    <text class="says" x="30" y="113">you pick what goes next</text>
    <rect class="card" x="22.5" y="130.5" width="199" height="83" rx="10" />
    <text class="key mono" x="34" y="154">APP-6</text>
    <text class="title" x="34" y="180">Print a shopping list</text>
    <text class="title" x="34" y="198">from a recipe</text>
    <rect class="card" x="22.5" y="222.5" width="199" height="83" rx="10" />
    <text class="key mono" x="34" y="246">APP-5</text>
    <text class="title" x="34" y="272">Search recipes by</text>
    <text class="title" x="34" y="290">ingredient</text>
  </g>

  <g data-column="Refine">
    <rect class="hatch" x="236" y="64" width="212" height="340" rx="12" />
    <rect class="box agent" x="250.5" y="78.5" width="21" height="21" rx="6" />
    <use href="#agent" xlink:href="#agent" class="glyph agent" x="254.5" y="82.5" width="13" height="13" />
    <text class="col" x="279" y="94">Refine</text>
    <text class="count mono" x="434" y="94" text-anchor="end">1</text>
    <text class="says mono" x="250" y="113">haiku · low · ~$0.05</text>
    <rect class="card running" x="242.5" y="130.5" width="199" height="103" rx="10" />
    <text class="key mono" x="254" y="154">APP-4</text>
    <rect class="pill-running" x="356" y="140" width="74" height="20" rx="10" />
    <circle class="amber-ink" cx="367" cy="150" r="3" />
    <text class="pill amber-ink mono" x="375" y="154">2m 05s</text>
    <text class="title" x="254" y="180">Show the prep time</text>
    <text class="title" x="254" y="198">on each recipe</text>
    <text class="act mono" x="254" y="219">Read src/recipes/time.ts</text>
  </g>

  <g data-column="Plan">
    <rect class="hatch" x="456" y="64" width="212" height="340" rx="12" />
    <rect class="box agent" x="470.5" y="78.5" width="21" height="21" rx="6" />
    <use href="#agent" xlink:href="#agent" class="glyph agent" x="474.5" y="82.5" width="13" height="13" />
    <text class="col" x="499" y="94">Plan</text>
    <text class="count mono" x="654" y="94" text-anchor="end">1</text>
    <text class="says mono" x="470" y="113">sonnet · medium</text>
    <rect class="card ghost" x="462.5" y="130.5" width="199" height="83" rx="10" />
    <text class="key mono" x="474" y="154">APP-3</text>
    <rect class="pill-ready" x="542" y="140" width="108" height="20" rx="10" />
    <circle class="ready-ink" cx="553" cy="150" r="3" />
    <text class="pill ready-ink" x="561" y="154">Ready for you</text>
    <text class="ghost-title" x="474" y="180">Scale servings on</text>
    <text class="ghost-title" x="474" y="198">the recipe page</text>
  </g>

  <g data-column="Implement">
    <rect class="hatch" x="676" y="64" width="212" height="340" rx="12" />
    <rect class="ring" x="676.75" y="64.75" width="210.5" height="338.5" rx="11.25" />
    <rect class="box agent" x="690.5" y="78.5" width="21" height="21" rx="6" />
    <use href="#agent" xlink:href="#agent" class="glyph agent" x="694.5" y="82.5" width="13" height="13" />
    <text class="col" x="719" y="94">Implement</text>
    <text class="count mono" x="874" y="94" text-anchor="end">0</text>
    <text class="says mono" x="690" y="113">sonnet · medium</text>
    <rect class="drop" x="682.75" y="130.75" width="198.5" height="106.5" rx="10" />
    <use href="#agent" xlink:href="#agent" class="bolt" x="695" y="143" width="13" height="13" />
    <text class="drop-head" x="714" y="154">Drop to start Implement</text>
    <text class="command mono" x="695" y="175">Claude Code · sonnet ·</text>
    <text class="command mono" x="695" y="190">medium</text>
    <text class="esc" x="695" y="210">Esc cancels. Moving back</text>
    <text class="esc" x="695" y="224">never starts a run.</text>
  </g>

  <g data-column="QA">
    <rect class="hatch" x="896" y="64" width="40" height="340" rx="12" />
    <rect class="box agent" x="905.5" y="70.5" width="21" height="21" rx="6" />
    <use href="#agent" xlink:href="#agent" class="glyph agent" x="909.5" y="74.5" width="13" height="13" />
    <text class="slim agent" x="920" y="100" text-anchor="end" transform="rotate(-90 920 100)"><tspan class="col">QA</tspan><tspan class="count mono" dx="8">0</tspan></text>
  </g>

  <g data-column="Review">
    <rect class="box" x="953.5" y="70.5" width="21" height="21" rx="6" />
    <use href="#you" xlink:href="#you" class="glyph" x="957.5" y="74.5" width="13" height="13" />
    <text class="slim" x="968" y="100" text-anchor="end" transform="rotate(-90 968 100)"><tspan class="col">Review</tspan><tspan class="count mono" dx="8">0</tspan></text>
  </g>

  <g data-column="Pull request">
    <rect class="box" x="1001.5" y="70.5" width="21" height="21" rx="6" />
    <use href="#auto" xlink:href="#auto" class="glyph" x="1005.5" y="74.5" width="13" height="13" />
    <text class="slim" x="1016" y="100" text-anchor="end" transform="rotate(-90 1016 100)"><tspan class="col">Pull request</tspan><tspan class="count mono" dx="8">0</tspan></text>
  </g>

  <g data-column="Wrap-up">
    <rect class="hatch" x="1040" y="64" width="40" height="340" rx="12" />
    <rect class="box agent" x="1049.5" y="70.5" width="21" height="21" rx="6" />
    <use href="#agent" xlink:href="#agent" class="glyph agent" x="1053.5" y="74.5" width="13" height="13" />
    <text class="slim agent" x="1064" y="100" text-anchor="end" transform="rotate(-90 1064 100)"><tspan class="col">Wrap-up</tspan><tspan class="count mono" dx="8">0</tspan></text>
  </g>

  <g data-column="Closed">
    <rect class="box" x="1097.5" y="70.5" width="21" height="21" rx="6" />
    <use href="#archive" xlink:href="#archive" class="glyph" x="1101.5" y="74.5" width="13" height="13" />
    <text class="slim" x="1112" y="100" text-anchor="end" transform="rotate(-90 1112 100)"><tspan class="col">Closed</tspan><tspan class="count mono" dx="8">0</tspan></text>
  </g>

  <!-- The card in the hand, tilted over Implement, after the drop box. -->
  <g class="lift" transform="rotate(-3 788 298)">
    <rect class="card ready" x="688.5" y="256.5" width="199" height="83" rx="10" />
    <text class="key mono" x="700" y="280">APP-3</text>
    <rect class="pill-ready" x="768" y="266" width="108" height="20" rx="10" />
    <circle class="ready-ink" cx="779" cy="276" r="3" />
    <text class="pill ready-ink" x="787" y="280">Ready for you</text>
    <text class="title" x="700" y="306">Scale servings on</text>
    <text class="title" x="700" y="324">the recipe page</text>
  </g>
</svg>
